[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
ffi = true
fs_permissions = [{ access = "read", path = "./" }]
optimizer = true
# Runtime gas over deploy size. Since the Executor split, every contract sits
# far enough under EIP-170 to afford it: at this setting the core is
# 14,814 B, LiquidationModule 19,318 B, SwapModule 24,147 B (429 B spare: the
# Balancer and Fluid venues are a third module, DexModule, 6,017 B, that
# SwapModule delegatecalls). Measured on the
# mainnet fork suite against 200 runs: about 2,250 gas less per typical
# liquidation. Higher values build identical code. An adapter that pushes
# LiquidationModule past 24,576 B needs a lower setting for that file
# (compilation_restrictions) or another split.
optimizer_runs = 1000000
via_ir = true

[fuzz]
runs = 1000

[profile.full.fuzz]
runs = 100000

[profile.quick.fuzz]
runs = 1000

[invariant]
runs = 10000
depth = 8
fail_on_revert = true
