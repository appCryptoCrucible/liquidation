[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
ffi = true
fs_permissions = [{ access = "read", path = "./" }]
optimizer = true
optimizer_runs = 200
via_ir = true

[fuzz]
runs = 1000

[profile.full.fuzz]
runs = 100000

[profile.quick.fuzz]
runs = 1000

[invariant]
runs = 128
depth = 40
fail_on_revert = true
