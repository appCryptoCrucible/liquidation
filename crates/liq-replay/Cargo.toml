[package]
name = "liq-replay"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
liq-types = { path = "../liq-types" }
liq-protocol = { path = "../liq-protocol" }
liq-config = { path = "../liq-config" }
liq-watch = { path = "../liq-watch" }
liq-adapters-aave-v4 = { path = "../liq-adapters/aave-v4" }
alloy-primitives = { workspace = true, features = ["std"] }
alloy-sol-types = { workspace = true, features = ["std"] }
alloy-provider = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
arrayvec = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
revm = { workspace = true }
uniswap_v3_math = { version = "=0.6.2", default-features = false }

[[bin]]
name = "liq-diff-health"
path = "src/bin/liq-diff-health.rs"

[[bin]]
name = "liq-diff-run"
path = "src/bin/liq-diff-run.rs"

[lints]
workspace = true
