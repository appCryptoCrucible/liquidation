[package]
name = "liq-replay"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Forwards 16A PanicOnAlloc into this crate's test/bin binaries (GUIDE 16 §3).
alloc-assert = ["liq-bot/alloc-assert"]

[dependencies]
liq-types = { path = "../liq-types" }
liq-protocol = { path = "../liq-protocol" }
liq-config = { path = "../liq-config" }
liq-watch = { path = "../liq-watch" }
liq-adapters-aave-v4 = { path = "../liq-adapters/aave-v4" }
liq-bot = { path = "../liq-bot" }
liq-node = { path = "../liq-node" }
liq-state = { path = "../liq-state" }
liq-engine = { path = "../liq-engine" }
liq-flash = { path = "../liq-flash" }
liq-oracle = { path = "../liq-oracle" }
liq-obs = { path = "../liq-obs" }
liq-sim = { path = "../liq-sim" }
liq-router = { path = "../liq-router" }
alloy-primitives = { workspace = true, features = ["std"] }
alloy-sol-types = { workspace = true, features = ["std"] }
alloy-provider = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
arrayvec = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
revm = { workspace = true }
uniswap_v3_math = { version = "=0.6.2", default-features = false }

[[bin]]
name = "liq-diff-health"
path = "src/bin/liq-diff-health.rs"

[[bin]]
name = "liq-diff-run"
path = "src/bin/liq-diff-run.rs"

[[bin]]
name = "liq-bench"
path = "src/bench/main.rs"

[[test]]
name = "named_fixtures"
path = "fixtures/run.rs"

[lints]
workspace = true
