[package]
name = "liq-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
liq-types = { path = "../liq-types" }
liq-protocol = { path = "../liq-protocol" }
liq-config = { path = "../liq-config" }
alloy-primitives = { workspace = true, features = ["std", "serde"] }
alloy-sol-types = { workspace = true, features = ["std"] }
alloy-provider = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
alloy-signer = { workspace = true }
alloy-signer-local = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
figment = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
triple_buffer = { workspace = true }
smallvec = { workspace = true }
crossbeam-channel = { workspace = true }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true }
eventsource-stream = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "io-util"] }
rtrb = { workspace = true }

[dev-dependencies]
liq-node = { path = "../liq-node" }
alloy-primitives = { workspace = true, features = ["std", "serde"] }
arrayvec = { workspace = true }
