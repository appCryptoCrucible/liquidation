[package]
name = "liq-exec"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
liq-types = { path = "../liq-types" }
liq-protocol = { path = "../liq-protocol" }
liq-oracle = { path = "../liq-oracle" }
liq-watch = { path = "../liq-watch" }
alloy-primitives = { workspace = true, features = ["std"] }
alloy-sol-types = { workspace = true, features = ["std"] }
alloy-consensus = { version = "=1.8.3", default-features = false, features = ["std"] }
alloy-eips = { version = "=1.8.3", default-features = false, features = ["std"] }
alloy-network = { version = "=1.6.1", default-features = false }
alloy-signer = { workspace = true }
alloy-signer-local = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
smallvec = { workspace = true }

[dev-dependencies]
alloy-primitives = { workspace = true, features = ["std"] }
liq-obs = { path = "../liq-obs" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }

[lints]
workspace = true
