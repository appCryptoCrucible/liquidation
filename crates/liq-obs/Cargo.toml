[package]
name = "liq-obs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
liq-types = { path = "../liq-types" }
liq-watch = { path = "../liq-watch" }
alloy-primitives = { workspace = true, features = ["std", "serde"] }
metrics = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["std", "fmt", "registry"] }
socket2 = { version = "=0.6.5" }

[target.'cfg(target_os = "linux")'.dependencies]
perf-event = { version = "=0.4.8", default-features = false }

[dev-dependencies]
alloy-primitives = { workspace = true, features = ["std", "serde"] }

[lints]
workspace = true
