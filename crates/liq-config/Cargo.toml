[package]
name = "liq-config"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
liq-types = { path = "../liq-types" }
liq-protocol = { path = "../liq-protocol" }
alloy-primitives = { workspace = true, features = ["std", "serde"] }
alloy-sol-types = { workspace = true, features = ["std"] }
alloy-provider = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
alloy-eips = { version = "=2.4.2", default-features = false, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
figment = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
figment = { workspace = true, features = ["toml", "env", "test"] }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
jsonschema = "=0.26.2"

[lints]
workspace = true
