aave-v3 = 480_742
# Spark is an Aave V3 fork on the same adapter and Executor path.
spark = 480_742
# fork 623_074 − wrap 198_065 = 425_009 (frame 341_551 + guard 83_458);
# mainnet frame p75 337_491 (n 15) + that guard = 420_949 — fork is higher.
aave-v4 = 425_009
# mainnet frame p75 191_343 (median 127_424, n 15). Morpho's guard reads are
# inside the measured wraps (wrap was derived on Morpho).
morpho-blue = 191_343
# Fork, real vaults through the Executor (ForkFluid.t.sol at 26_081_900;
# tools/gas-measure/fork-trace-fluid.txt), fixed − wrap(aave) 198_065:
# T1 native collateral 264_933, T2 smart collateral in ETH 273_399, T3 smart
