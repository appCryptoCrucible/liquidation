# Measured gas model for one liquidation through our Executor.
# Loaded by crates/liq-bot/src/gas_model.rs; methodology in tools/gas-measure.
#
#   plan gas = [tx].base                         once per transaction
#            + [wrap].<flash provider>            once per flash group
#            + Σ legs ([liquidation].<protocol>   per liquidation leg
#                      + exit swap hops)          sized per plan from the pool book
#
# A protocol or provider missing here is NOT MEASURED: `select` skips its
# legs and the viability band refuses its pairs. Nothing is sized at 0 gas.
#
# Sources (measured 2026-09, head ~26_047_000)
#   fork     `forge test --isolate -vvvv` on ForkLiveLiquidations.t.sol
#            (test_fork_* and test_gas_*) and ForkShareRedeem.t.sol at block
#            26_019_284 (Compound at 22_000_000), decomposed by
#            tools/gas-measure/fork_decompose.py into swap frames and the
#            rest ("fixed").
#   mainnet  tools/gas-measure/measure.py: 71 real liquidations in the last
#            150k blocks replayed with `cast run --quick`; gas of the call
#            frame into the protocol contract that emitted the liquidation
#            event (median / p75 / p90 per protocol below).
#   wrap     = min over fork-measured protocols of (fixed − protocol frame)
#              for that provider: executor + flash, no protocol call.
#   leg      = mainnet p75 protocol frame + our Executor's guard reads for
#              that adapter. p75, not median: the band is a pre-filter and
#              under-charging gas passes losing sizes.
#
# 2026-10-05, three Executor changes: no health view before a liquidation
# call (the protocol's own check, inside try/catch, is the guard); one
# `approve` call per allowance, cleared afterwards only when the spender
# left some; a Curve leg asks the one MetaRegistry handler that holds its
# pool. Every fork test above was run before and after on the same state
# (`forge test --isolate`, Foundry v1.8.3, `vm.lastCallGas`: the whole
# transaction after refunds). Swap frames did not move, so each change is a
# change of "fixed", and the figures below moved by it:
#   wrap     by the change of its Morpho fixture (test_gas_morpho_weth_* and
#            test_fork_morpho_weth_aave_flash);
#   leg      by the change of its own fixture less the change of the wrap it
#            was derived on (aave), the smallest when several were measured.
# Each (protocol, provider) pair measured then sums to a total that fell by
# no more than its measured saving (Liquity's leg is its frame alone and it
# runs without a lender: unchanged). No leg was re-derived from its formula:
# the removed views paid cold accesses for the liquidation call, which now
# pays them itself (fork frames grew 53k–107k, Aave V3's by 92k), and the
# mainnet p75 frames always included them, so a leg here still counts them
# twice, as it did before.

[tx]
# 21_000 intrinsic + ~6_000 calldata (plans measured at 333–385 bytes,
# ~4.7–5.3k gas) + one profit swap ([swap].univ3).
# + 6_000 since the Executor split into a core and two delegatecalled modules
# (2026-10). Compiled at 1_000_000 optimizer runs; `execute` decodes each
# flash group once, runs it from that decode, and hands it to its callback
# through transient storage. Measured on the mainnet fork suite
# (`forge test --isolate -vvvv`, Foundry v1.8.3), the same 70 execute calls
# before and after the split, our code's gas only: one flash group with repay
# and profit swaps +5_927 median (n 48, +3_769..+6_516), one swap batch
# +4_720 (n 7), no swaps +3_078 (n 15). Most of it is the first touch of each
# module (a cold account, 2 × 2_600). All of it is charged here: a second
# flash group costs about 3_000 less than on the single contract (unit suite,
# our code only; no fork test has two groups).
base = 115_100

