# Measured gas model for one liquidation through our Executor.
# Loaded by crates/liq-bot/src/gas_model.rs; methodology in tools/gas-measure.
#
#   plan gas = [tx].base                         once per transaction
#            + [wrap].<flash provider>            once per flash group
#            + Σ legs ([liquidation].<protocol>   per liquidation leg
#                      + exit swap hops)          sized per plan from the pool book
#
# A protocol or provider missing here is NOT MEASURED: `select` skips its
# legs and the viability band refuses its pairs. Nothing is sized at 0 gas.
#
# Sources (measured 2026-09, head ~26_047_000)
#   fork     `forge test --isolate -vvvv` on ForkLiveLiquidations.t.sol
#            (test_fork_* and test_gas_*) and ForkShareRedeem.t.sol at block
#            26_019_284 (Compound at 22_000_000), decomposed by
#            tools/gas-measure/fork_decompose.py into swap frames and the
#            rest ("fixed").
#   mainnet  tools/gas-measure/measure.py: 71 real liquidations in the last
#            150k blocks replayed with `cast run --quick`; gas of the call
#            frame into the protocol contract that emitted the liquidation
#            event (median / p75 / p90 per protocol below).
#   wrap     = min over fork-measured protocols of (fixed − protocol frame)
#              for that provider: executor + flash, no protocol call.
#   leg      = mainnet p75 protocol frame + our Executor's guard reads for
#              that adapter. p75, not median: the band is a pre-filter and
#              under-charging gas passes losing sizes.

[tx]
# 21_000 intrinsic + ~6_000 calldata (plans measured at 333–385 bytes,
# ~4.7–5.3k gas) + one profit swap ([swap].univ3).
# + 5_800 since the Executor split into a core and two delegatecalled modules
# (2026-10), compiled at 1_000_000 optimizer runs. Measured on the mainnet
# fork suite (`forge test --isolate -vvvv`, Foundry v1.8.3), the same 70
# execute calls before and after the split, our code's gas only: one flash
# group with repay and profit swaps +10_031 median (n 48, +8_758..+10_574;
# +12_280 at 200 runs), one swap batch +9_044 (n 7), no swaps +6_475 (n 15).
# Where it goes: the first touch of each module is a cold account
# (2 × 2_600), each delegatecall copies the plan and decodes its arguments,
# and the core walks the plan ~600 gas dearer per walk than the single
# contract did (the same PlanDecoder, inlined less; three walks per group).
# Split as 5_800 here + 4_300 per group in [wrap]: a second group costs
# +4_277 on the unit suite (our code only; no fork test has two groups).
base = 114_900

[wrap]
# Each includes 4_300 since the split: per flash group, the delegatecalls into
# the liquidation module (its legs) and the swap module (its repay swaps).
aave = 202_365
morpho = 132_489
univ3 = 136_972
univ4 = 110_201
# DERIVED: Sky DSS was only measurable against Aave V3 (DAI debt):
# 296_199 there, minus Aave V3's average guard excess over Morpho across the
# providers measured on both (96_278); + 4_300 (split).
sky_dss = 204_221
# Aave V3 flash wrapping an Aave V4 leg: same wrap as `aave`; the V4 leg's
# extra cost is in [liquidation].aave-v4.
aave_v4 = 202_365

[liquidation]
