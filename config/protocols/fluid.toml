# Fluid Vaults mainnet — `Instadapp/fluid-contracts-public` @ `9496626f71a761fc296dc3b2efbfd54c504e18f0`
#
# VaultFactory: 0x324c5Dc1fC42c7a4D43d92df1eBA58A54d13Bf2d
# (`deployments/mainnet/VaultFactory.json` at that commit).
#
# Every vault is read from chain at bind (`Config::bind_live`): the factory's
# `totalVaults` / `getVaultAddress`, each vault's `TYPE` (T1 has none) and
# `constantsView`, and token decimals. Tokens map through the registry
# intern; native ETH (0xEeee…) is paid and received as WETH by the Executor,
# so it is priced and routed as WETH. A vault side with no interned token is
# not quoted. Nothing about the vault set is typed in here.
#
# Liquidatable size is the vault's own answer, read every block (dead-address
# `liquidate` / `simulateLiquidate`, then the DEX's one-token estimate on a
# smart side) — `docs/coverage/fluid.md`.
#
# Intern: ProtocolId 10. MarketIds 4000..=4999 (catalog 4000; vault N → 4000+N).
# Never 0..=3480 or 3481..=3999 (registry, Euler); Morpho owns 5000+.

protocol = 10
factory = "0x324c5Dc1fC42c7a4D43d92df1eBA58A54d13Bf2d"
