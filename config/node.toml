# Ethereum mainnet only (D01). `rpc_url` is empty in git — set LIQ_RPC_URL.
# The boot assertion refuses to start if this is still empty at Validate.
chain_id = 1
registry_path = "registry/registry.json"
rpc_url = ""
# Live send on (D64: no staged rollout; monitored manually). Hot-reloaded:
# set false to stop sending without a restart.
submit_enabled = true
# First-start state replay (D65) begins here: the earliest deployment among
# the addresses the bound adapters subscribe to (Compound V2 Comptroller,
# 0x3d98…9cd3b). `reth download --with-receipts-since` must be at or below
# it. Recompute when an adapter adds an older contract.
backfill_from = 7710671
# Blocks between state snapshots while running.
snapshot_every_blocks = 100
