# Production pin map: AMD EPYC 4564P (Zen 4 Raphael, 16 cores / 32 threads,
# 2 CCDs x 8, 32 MB L3 each, one socket, one NUMA node).
#
# Standard Linux enumeration for this die: physical CPUs 0-15, SMT sibling
# of N is N+16. CCD0 L3 is "0-7,16-23". CCD1 L3 is "8-15,24-31".
# On Linux, startup (allow_unpinned = false) reads
# /sys/devices/system/cpu/cpuN/cache/index3/shared_cpu_list and refuses
# to start if a slice differs. Confirm once with `lscpu -e` before leaving
# the node running. A pin that succeeds does not prove L3 placement until
# that check passes.
#
# Kernel isolcpus (ops/host/cmdline) is narrower than the CCD1 list:
# isolated logical CPUs are 0-13 and 16-29. 14, 15, 30 and 31 stay for
# Reth and Lighthouse. `isolated` below is the sim-worker rule, not the
# kernel mask.

schema = 1

[[l3]]
# CCD0. Hot path only: cores 0, 1, 2. Cores 3-7 and SMT siblings 16-23
# stay empty so this 32 MB L3 keeps the position columns.
shared_cpu_list = "0-7,16-23"
numa = 0
isolated = true
exclusive_hot = true

[[l3]]
# CCD1. Sim workers on 8-11 (SMT siblings 24-27 unpinned). Router and
# submit own physical cores 12 and 13. CEX, telemetry and drift share
# the Reth/Lighthouse cores.
shared_cpu_list = "8-15,24-31"
numa = 0
isolated = true
exclusive_hot = false

[[thread]]
name = "liq-node-hot"
core = 0

[[thread]]
name = "liq-oracle-fusion"
core = 1

[[thread]]
name = "liq-engine-recompute"
core = 2

[[thread]]
name = "liq-sim-worker-0"
core = 8

[[thread]]
name = "liq-sim-worker-1"
core = 9

[[thread]]
name = "liq-sim-worker-2"
core = 10

[[thread]]
name = "liq-sim-worker-3"
core = 11

[[thread]]
name = "liq-router-cache"
core = 12

[[thread]]
name = "liq-exec-submit"
core = 13

[[thread]]
name = "liq-oracle-cex"
core = 14

[[thread]]
name = "liq-obs-telemetry"
core = 30

[[thread]]
name = "liq-obs-drift"
core = 31
