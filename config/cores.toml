# Production pin map: AMD Ryzen 7 9800X3D (Zen 5, 8 cores / 16 threads, one
# CCD, one 96 MB L3 shared by every core, one socket, one NUMA node).
#
# Standard Linux enumeration for this die: physical CPUs 0-7, SMT sibling
# of N is N+8. The one L3 is "0-15". On Linux, startup (allow_unpinned =
# false) reads /sys/devices/system/cpu/cpuN/cache/index3/shared_cpu_list
# and refuses to start if the slice differs. Confirm once with `lscpu -e`
# before leaving the node running.
#
# One L3 means the hot path cannot own an L3 slice (the two-CCD EPYC map
# gave it CCD0). It owns cores instead: `hot_cpu_list` is the three hot
# cores and their SMT siblings, which stay empty so no other thread shares
# their execution units or L1/L2. The 96 MB L3 is shared with the sim
# workers and the route builder; the hot band (~25 KB) is a rounding error
# against it, which is the X3D part's case.
#
# Kernel isolcpus (ops/host/cmdline): logical CPUs 0-5 and 8-13. 6, 7, 14
# and 15 stay for Reth, Lighthouse and IRQs. `isolated` below is the
# sim-worker rule, not the kernel mask.

schema = 1

[[l3]]
# The whole die. Hot path: cores 0, 1, 2 (siblings 8, 9, 10 reserved).
# Sim workers: both threads of cores 3 and 4 (3, 4, 11, 12). Router cache
# and submit: core 5 and its sibling 13. CEX, telemetry and drift share the
# Reth/Lighthouse CPUs 6, 7, 14, 15.
shared_cpu_list = "0-15"
numa = 0
isolated = true
exclusive_hot = true
hot_cpu_list = "0-2,8-10"

[[thread]]
name = "liq-node-hot"
core = 0

[[thread]]
name = "liq-oracle-fusion"
core = 1

[[thread]]
name = "liq-engine-recompute"
core = 2

[[thread]]
name = "liq-sim-worker-0"
core = 3

[[thread]]
name = "liq-sim-worker-1"
core = 4

[[thread]]
name = "liq-sim-worker-2"
core = 11

[[thread]]
name = "liq-sim-worker-3"
core = 12

[[thread]]
name = "liq-router-cache"
core = 5

[[thread]]
name = "liq-exec-submit"
core = 13

[[thread]]
name = "liq-oracle-cex"
core = 6

[[thread]]
name = "liq-obs-telemetry"
core = 14

[[thread]]
name = "liq-obs-drift"
core = 15
