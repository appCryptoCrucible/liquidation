name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: fmt · clippy · test · deny · dep-lint
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install system packages (git before checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config libssl-dev

      - uses: actions/checkout@v4

      - name: Install Rust 1.95.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add rustfmt clippy

      - name: reject panic=abort in release profiles
        run: |
          set -euo pipefail
          if grep -RIn --include='Cargo.toml' 'panic\s*=\s*"abort"' .; then
            echo "panic = \"abort\" is forbidden (GUIDE 03 §4b containment)"
            exit 1
          fi

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install Foundry
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          "$HOME/.foundry/bin/foundryup" --install v1.8.3  # pinned: .gas-snapshot is this version's gas
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Install forge-std
        working-directory: contracts
        run: forge install foundry-rs/forge-std --no-git

      - name: forge build
        working-directory: contracts
        run: forge build

      - name: cargo test
        run: cargo test --workspace

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: dependency lint
        run: bash tools/dep-lint.sh

  differential:
    name: 05A differential (quick 1k)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install system packages (git before checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config libssl-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust 1.95.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Foundry
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          "$HOME/.foundry/bin/foundryup" --install v1.8.3  # pinned: .gas-snapshot is this version's gas
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Install forge-std
        working-directory: contracts
        run: forge install foundry-rs/forge-std --no-git

      - name: Build FFI binary
        run: cargo build -p liq-replay --bin liq-diff-health

      - name: forge test --quick (1k)
        working-directory: contracts
        env:
          LIQ_DIFF_BIN: ../target/debug/liq-diff-health
          FOUNDRY_FUZZ_RUNS: "1000"
        run: forge test --match-path test/differential/HealthDiff.t.sol --fuzz-runs 1000

  foundry:
    name: forge test · snapshot · safe-erc20
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install system packages (git before checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config libssl-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust 1.95.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Foundry
        run: |
          curl -L https://foundry.paradigm.xyz | bash
          "$HOME/.foundry/bin/foundryup" --install v1.8.3  # pinned: .gas-snapshot is this version's gas
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Install forge-std
        working-directory: contracts
        run: forge install foundry-rs/forge-std --no-git

      - name: generate PlanEncodingRoundTrip vectors
        run: cargo test -p liq-plan write_solidity_roundtrip_cases -- --exact

      # Fork tests (test/fork) pin historical blocks and need an archive RPC.
      # They run locally with MAINNET_RPC_URL, not in CI.
      - name: forge test (unit + invariant)
        working-directory: contracts
        run: forge test --no-match-path "test/{fork,differential}/*"

      - name: forge snapshot --check (2%)
        working-directory: contracts
        # Deterministic suites only: fork tests need an RPC and move with the
        # chain; fuzz and invariant gas varies run to run (no fixed seed).
        run: forge snapshot --check --tolerance 2 --match-path "test/{unit,gas}/*"

      - name: no raw IERC20 transfer/approve in src
        run: |
          if grep -REn 'IERC20\([^)]+\)\.(transfer|approve)\(' contracts/src; then
            echo "raw IERC20.transfer/approve is forbidden; use SafeTransfer"
            exit 1
          fi
          echo "ok: no raw IERC20.transfer/approve in contracts/src"

  reth:
    # The `reth` binary (the ExEx) builds only on Unix: Reth's static-file
    # storage is `cfg(unix)`. The workspace jobs do not enable `node`.
    name: reth ExEx build (Linux)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install system packages (git before checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config libssl-dev clang libclang-dev

      - uses: actions/checkout@v4

      - name: Install Rust 1.95.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.95.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add clippy

      - name: cargo clippy -p liq-reth --features node
        run: cargo clippy -p liq-reth --features node --all-targets -- -D warnings
